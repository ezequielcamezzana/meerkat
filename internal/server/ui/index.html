<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Meerkat</title>
        <link rel="icon" type="image/png" href="/app/assets/favicon.ico" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            /* Form elements don't inherit font by default — force the body font
               (ui-sans) so buttons/selects/inputs don't fall back to Arial. */
            button,
            input,
            select,
            textarea {
                font-family: inherit;
            }
            /* Keyboard focus — neutral grey, no brand color (per design system). */
            :focus-visible {
                outline: 2px solid var(--charcoal);
                outline-offset: 1px;
            }

            :root {
                --primary: #000000;
                --on-primary: #ffffff;
                --ink: #000000;
                --charcoal: #525252;
                --body: #737373;
                --mute: #a3a3a3;
                --canvas: #ffffff;
                --surface-soft: #fafafa;
                --surface-dark: #171717;
                --hairline: #e5e5e5;
                --hairline-strong: #d4d4d4;
                --on-dark: #ffffff;
                --on-dark-mute: rgba(255, 255, 255, 0.7);

                /* Shape: pills for interactive, 12px cards, 6px tooltips. */
                --radius-full: 9999px;
                --radius-lg: 12px;
                --radius-sm: 6px;

                /* Severity palette — soft tint (bg) + matching ink (fg). */
                --color-severity-critical: #fee2e2;
                --color-severity-critical-ink: #991b1b;
                --color-severity-high: #ffedd5;
                --color-severity-high-ink: #9a3412;
                --color-severity-medium: #fef9c3;
                --color-severity-medium-ink: #854d0e;
                --color-severity-low: #fafafa;
                --color-severity-low-ink: #525252;
                --color-severity-none: #fafafa;
                --color-severity-none-ink: #a3a3a3;
            }

            body {
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    sans-serif;
                font-size: 16px;
                line-height: 1.5;
                color: var(--ink);
                background: var(--canvas);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            /* Nav */
            nav {
                height: 56px;
                position: sticky;
                top: 0;
                z-index: 50;
                background: var(--canvas);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 32px;
            }
            nav .brand {
                font-family:
                    ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
                font-size: 16px;
                font-weight: 600;
                color: var(--ink);
                text-decoration: none;
            }
            nav .nav-left {
                display: flex;
                align-items: center;
                gap: 20px;
            }
            nav .nav-right {
                display: flex;
                align-items: center;
                gap: 14px;
            }
            .guest-badge {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--mute);
                border: 1px solid var(--hairline);
                border-radius: 999px;
                padding: 3px 10px;
            }
            .nav-link {
                font-size: 14px;
                color: var(--charcoal);
                text-decoration: none;
                padding: 4px 0;
            }
            .nav-link:hover {
                color: var(--ink);
            }
            .nav-link.active {
                color: var(--ink);
                text-decoration: underline;
                text-underline-offset: 4px;
            }

            /* Settings page */
            .settings-panel {
                max-width: 480px;
            }
            .settings-panel h1 {
                margin-bottom: 4px;
            }
            .settings-sub {
                font-size: 14px;
                color: var(--mute);
                margin-bottom: 24px;
            }
            .settings-card {
                background: var(--canvas);
                border: 1px solid var(--hairline);
                border-radius: var(--radius-lg);
                padding: 24px;
            }
            .settings-field {
                margin-bottom: 24px;
            }
            .settings-field label {
                display: block;
                font-size: 14px;
                font-weight: 500;
                color: var(--ink);
                margin-bottom: 6px;
            }
            .settings-field textarea {
                width: 100%;
                min-height: 100px;
                padding: 8px 12px;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 13px;
                border: 1px solid var(--hairline-strong);
                border-radius: var(--radius-lg);
                background: var(--canvas);
                color: var(--ink);
                resize: vertical;
            }
            .settings-field textarea:focus {
                outline: none;
                border-color: var(--ink);
            }
            .settings-toggle {
                display: flex;
                align-items: center;
                gap: 10px;
                cursor: pointer;
            }
            .settings-toggle input[type="checkbox"] {
                width: 16px;
                height: 16px;
                cursor: pointer;
            }
            .settings-hint {
                font-size: 12px;
                color: var(--mute);
                margin-top: 4px;
            }
            .settings-feedback {
                font-size: 13px;
                margin-top: 12px;
                min-height: 20px;
            }
            .settings-feedback.ok {
                color: var(--ink);
            }
            .settings-feedback.err {
                color: var(--charcoal);
            }

            /* Layout */
            main {
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
                padding: 48px 32px 88px;
                flex: 1 0 auto;
            }

            h1 {
                font-family:
                    ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
                font-size: 24px;
                font-weight: 600;
                line-height: 1.33;
                color: var(--ink);
                margin-bottom: 24px;
            }

            /* Status badges — pills */
            .badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 3px 10px;
                border-radius: 9999px;
                font-size: 12px;
                font-weight: 500;
                line-height: 1.33;
                white-space: nowrap;
            }
            .badge-clean {
                background: var(--surface-soft);
                color: var(--charcoal);
                border: 1px solid var(--hairline);
            }
            .badge-low {
                background: var(--surface-soft);
                color: var(--charcoal);
                border: 1px solid var(--hairline);
            }
            .badge-medium {
                background: #fef9c3;
                color: #854d0e;
                border: 1px solid #fde047;
            }
            .badge-high {
                background: #ffedd5;
                color: #9a3412;
                border: 1px solid #fdba74;
            }
            .badge-critical {
                background: #fee2e2;
                color: #991b1b;
                border: 1px solid #fca5a5;
            }
            .badge-vulnerable {
                background: var(--surface-dark);
                color: var(--on-dark);
            }
            .badge-stale-pill {
                background: var(--surface-soft);
                color: var(--mute);
                border: 1px solid var(--hairline);
            }
            .dot {
                width: 6px;
                height: 6px;
                border-radius: 9999px;
                display: inline-block;
                flex-shrink: 0;
            }
            .dot-clean {
                background: #27c93f;
            }
            .dot-low {
                background: #94a3b8;
            }
            .dot-medium {
                background: #eab308;
            }
            .dot-high {
                background: #f97316;
            }
            .dot-critical {
                background: #ef4444;
            }
            .dot-vuln {
                background: #ff5f56;
            }
            .dot-stale {
                background: var(--mute);
            }

            /* Exposure bucket inline badges (vuln rows) */
            .bucket-badge {
                display: inline-flex;
                align-items: center;
                padding: 1px 7px;
                border-radius: 9999px;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.02em;
                white-space: nowrap;
            }
            .bucket-critical {
                background: #fee2e2;
                color: #991b1b;
            }
            .bucket-high {
                background: #ffedd5;
                color: #9a3412;
            }
            .bucket-medium {
                background: #fef9c3;
                color: #854d0e;
            }
            .bucket-low {
                background: var(--surface-soft);
                color: var(--charcoal);
            }
            .bucket-clean {
                display: none;
            }

            /* ── Endpoint vuln page ──────────────────────────────────────────── */
            .ep-page {
                padding: 32px 0;
            }
            .ep-page-top {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                margin-bottom: 24px;
                gap: 12px;
            }
            .ep-report-actions {
                display: flex;
                gap: 8px;
            }
            .ep-header {
                display: grid;
                grid-template-columns: auto 1fr auto;
                gap: 24px;
                align-items: stretch;
                margin-bottom: 32px;
            }
            .ep-donut {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 0 8px;
            }
            .ep-donut-wrap {
                position: relative;
                display: inline-block;
                cursor: default;
            }
            .ep-donut-tooltip {
                position: absolute;
                bottom: calc(100% + 8px);
                left: 50%;
                transform: translateX(-50%);
                background: var(--surface-dark);
                color: var(--on-dark);
                border-radius: var(--radius-sm);
                padding: 8px 14px;
                font-size: 11px;
                white-space: nowrap;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.15s;
                z-index: 100;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .ep-donut-wrap:hover .ep-donut-tooltip {
                opacity: 1;
            }
            .ep-legend-item {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .ep-legend-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                flex-shrink: 0;
            }
            .ep-info-card {
                border: 1px solid var(--hairline);
                border-radius: 12px;
                padding: 20px 24px;
                display: flex;
                flex-direction: column;
            }
            .ep-info-card h2 {
                font-size: 20px;
                font-weight: 500;
                margin-bottom: 12px;
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            .es-info-wrap {
                position: relative;
                display: inline-flex;
                align-items: center;
            }
            .es-info-icon {
                font-style: normal;
                font-size: 9px;
                opacity: 0.5;
                cursor: default;
                margin-left: 2px;
            }
            .es-tooltip {
                position: absolute;
                bottom: calc(100% + 6px);
                left: 50%;
                transform: translateX(-50%);
                background: var(--surface-dark);
                color: var(--on-dark);
                border-radius: var(--radius-sm);
                padding: 6px 10px;
                font-size: 11px;
                font-weight: 400;
                line-height: 1.5;
                white-space: nowrap;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.15s;
                z-index: 100;
            }
            .es-info-wrap:hover .es-tooltip {
                opacity: 1;
            }
            .vuln-pkg-count {
                font-size: 11px;
                color: var(--mute);
                white-space: nowrap;
                flex-shrink: 0;
            }
            /* Expanded detail: aliases + description (left), dates stacked (right) */
            .vuln-detail-top {
                display: none;
                align-items: flex-start;
                gap: 16px 28px;
                flex-wrap: wrap;
                padding: 16px 26px;
            }
            .vuln-row-new.open .vuln-detail-top {
                display: flex;
            }
            .vuln-detail-main {
                flex: 1;
                min-width: 240px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .vuln-aliases {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
            }
            .vuln-dates {
                display: flex;
                flex-direction: column;
                gap: 4px;
                flex-shrink: 0;
                font-size: 11px;
                color: var(--charcoal);
            }
            .vuln-dates .vm-k {
                color: var(--mute);
            }
            /* Inline discovered/updated dates in the global vuln list row */
            .gv-row-dates {
                display: flex;
                gap: 14px;
                font-size: 11px;
                color: var(--charcoal);
                white-space: nowrap;
            }
            .gv-row-dates .vm-k {
                color: var(--mute);
            }
            /* Lazily-loaded expand body: advisory + affected endpoints */
            .gv-detail {
                display: none;
                flex-direction: column;
                gap: 16px;
                padding: 16px 26px;
            }
            .vuln-row-new.open .gv-detail {
                display: flex;
            }
            .gv-advisory {
                font-size: 12px;
                line-height: 1.5;
                color: var(--charcoal);
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }
            .gv-affected-label {
                font-size: 11px;
                color: var(--mute);
                margin-bottom: 8px;
            }
            .gv-affected-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .pkg-purl-row td {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 10px;
                color: var(--mute);
                padding: 8px 10px 2px;
                border-bottom: none !important;
            }
            /* 30-day timeline */
            .ep-timeline {
                display: flex;
                gap: 3px;
                align-items: center;
                justify-content: center;
                margin-bottom: 28px;
            }
            .ep-tl-label {
                font-size: 11px;
                color: var(--mute);
                white-space: nowrap;
            }
            .tl-day {
                width: 13px;
                height: 13px;
                border-radius: 2px;
                flex-shrink: 0;
                cursor: default;
                transition: opacity 0.1s;
            }
            .tl-day:hover {
                opacity: 0.75;
            }
            .tl-empty {
                background: var(--hairline);
            }
            .tl-clean {
                background: #86efac;
            }
            .tl-low {
                background: #cbd5e1;
            }
            .tl-medium {
                background: #fde047;
            }
            .tl-high,
            .tl-vulnerable {
                background: #fdba74;
            }
            .tl-critical {
                background: #fca5a5;
            }
            /* History metrics legend (under the timeline) */
            .ep-metrics-legend {
                display: flex;
                gap: 20px;
                justify-content: center;
                flex-wrap: wrap;
                margin: -16px 0 28px;
            }
            .ep-metric {
                font-size: 12px;
                display: inline-flex;
                gap: 5px;
                align-items: baseline;
            }
            .ep-metric-val {
                font-weight: 600;
                font-variant-numeric: tabular-nums;
            }
            .ep-metric-label {
                color: var(--mute);
            }
            .delta-up {
                color: var(--charcoal);
            }
            .delta-down {
                color: var(--charcoal);
            }
            .delta-flat {
                color: var(--mute);
            }
            /* Key/value grid inside the info card */
            .ep-kv-grid {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 14px 28px;
            }
            .ep-kv {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
            }
            .ep-kv-label {
                font-size: 11px;
                color: var(--mute);
                line-height: 1.2;
            }
            .ep-kv-value {
                font-size: 13px;
                color: var(--charcoal);
                line-height: 1.3;
                overflow-wrap: anywhere;
            }
            .ep-kv-value code {
                font-size: 12px;
            }
            /* Scan metrics grid — divided from identity by a hairline */
            .ep-scan-row {
                margin-top: 14px;
                padding-top: 14px;
                border-top: 1px solid var(--hairline);
            }
            /* Canonical vuln meta line */
            .vuln-new {
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.04em;
                color: var(--on-primary);
                background: var(--ink);
                border-radius: 9999px;
                padding: 1px 7px;
                white-space: nowrap;
            }
            .vuln-tag {
                font-size: 11px;
                color: var(--charcoal);
                background: var(--surface-soft);
                border: 1px solid var(--hairline);
                border-radius: 9999px;
                padding: 1px 8px;
                white-space: nowrap;
            }
            /* Filter bar */
            .vuln-filter-bar {
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 16px;
                flex-wrap: wrap;
            }
            .vuln-filter-left {
                display: flex;
                gap: 8px;
                align-items: center;
                flex: 1;
            }
            .vuln-search-input {
                flex: 1;
                max-width: 320px;
                height: 36px;
                padding: 0 12px;
                font-size: 13px;
                border: 1px solid var(--hairline-strong);
                border-radius: 9999px;
                background: var(--canvas);
                color: var(--ink);
                outline: none;
            }
            .vuln-search-input:focus {
                border-color: var(--ink);
            }
            .vuln-bucket-select {
                height: 36px;
                padding: 0 34px 0 16px;
                font-size: 13px;
                border: 1px solid var(--hairline-strong);
                border-radius: 9999px;
                background-color: var(--canvas);
                color: var(--ink);
                outline: none;
                cursor: pointer;
                -webkit-appearance: none;
                appearance: none;
                background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1l4 4 4-4' stroke='%23737373' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
                background-repeat: no-repeat;
                background-position: right 14px center;
            }
            .modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.4);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 100;
                padding: 24px;
            }
            .modal-card {
                background: var(--canvas);
                border: 1px solid var(--hairline);
                border-radius: var(--radius-lg);
                padding: 24px;
                width: 100%;
                max-width: 440px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }
            .modal-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .modal-title {
                font-size: 16px;
                font-weight: 600;
                color: var(--ink);
            }
            .modal-close {
                border: none;
                background: none;
                font-size: 22px;
                line-height: 1;
                color: var(--mute);
                cursor: pointer;
            }
            .modal-sub {
                font-size: 13px;
                color: var(--body);
                margin: 0;
            }
            .mechanic-stats {
                font-size: 14px;
                color: var(--charcoal);
                padding: 12px 16px;
                background: var(--surface-soft);
                border-radius: var(--radius-sm);
            }
            .mechanic-help {
                font-size: 12px;
                color: var(--body);
                margin: 0;
                padding-left: 18px;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .vuln-pagination {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 13px;
                color: var(--charcoal);
            }
            .page-btn {
                height: 32px;
                min-width: 32px;
                padding: 0 10px;
                border: 1px solid var(--hairline-strong);
                border-radius: 9999px;
                background: var(--canvas);
                color: var(--charcoal);
                font-size: 13px;
                cursor: pointer;
            }
            .page-btn:disabled {
                opacity: 0.35;
                cursor: default;
            }
            .page-btn:not(:disabled):hover {
                background: var(--surface-soft);
            }
            /* Vuln list new */
            .vuln-list-new {
                border: 1px solid var(--hairline);
                border-radius: 12px;
                overflow: hidden;
            }
            .vuln-row-new {
                border-bottom: 1px solid var(--hairline);
            }
            .vuln-row-new:last-child {
                border-bottom: none;
            }
            .vuln-row-header {
                padding: 14px 20px;
                display: flex;
                align-items: center;
                gap: 10px;
                cursor: pointer;
                user-select: none;
                justify-content: space-between;
            }
            .vuln-row-header:hover {
                background: var(--surface-soft);
            }
            .vuln-row-header-left {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                flex: 1;
                min-width: 0;
            }
            .vuln-row-header-right {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 8px;
                flex-wrap: wrap;
                flex-shrink: 0;
            }
            .vuln-cid {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 18px;
                font-weight: 600;
                color: var(--ink);
                letter-spacing: -0.01em;
                white-space: nowrap;
            }
            .vuln-alias-chip {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 11px;
                padding: 1px 6px;
                border: 1px solid var(--hairline);
                border-radius: var(--radius-full);
                color: var(--charcoal);
                white-space: nowrap;
            }
            .vuln-chevron {
                color: var(--mute);
                font-size: 11px;
                transition: transform 0.15s;
                flex-shrink: 0;
            }
            .vuln-chevron.open {
                transform: rotate(90deg);
            }
            .vuln-row-summary {
                font-size: 13px;
                color: var(--body);
            }
            .vuln-pkg-area {
                padding: 0 20px 16px;
                display: none;
            }
            .vuln-row-new.open .vuln-pkg-area {
                display: block;
            }
            .pkg-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
            }
            .pkg-table th {
                text-align: left;
                font-weight: 500;
                color: var(--mute);
                font-size: 11px;
                padding: 6px 10px;
                border-bottom: 1px solid var(--hairline);
            }
            .pkg-table td {
                padding: 8px 10px;
                border-bottom: 1px solid var(--hairline);
                vertical-align: top;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                color: var(--charcoal);
            }
            .pkg-table tr:last-child td {
                border-bottom: none;
            }

            }

        <script>
            let selectedID = null;
            let viewMode = localStorage.getItem("meerkat.viewMode") || "list";
            let activeTag = null;
            let allEndpoints = [];
            let totalCount = 0;
            let isGuest = false; // read-only session — set by loadSession()
            let magpieURL = ""; // Magpie base URL — set by loadSession(); "" disables PURL links

            // ── view / tag state ─────────────────────────────────────────────────────

            function setView(mode) {
                viewMode = mode;
                localStorage.setItem("meerkat.viewMode", mode);
                document
                    .getElementById("btn-list")
                    .classList.toggle("active", mode === "list");
                document
                    .getElementById("btn-panel")
                    .classList.toggle("active", mode === "panel");
                render();
            }

            function setTag(tag) {
                activeTag = tag;
                render();
            }

            // ── helpers ───────────────────────────────────────────────────────────────

            // Escapes data-derived strings before they go into innerHTML, so
            // inventory fields (hostname, purl, summary…) render as text and can't
            // inject markup. Use on EVERY interpolation of scanner-supplied data.
            function esc(s) {
                return String(s ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            // Renders a PURL as text, or — when Magpie is configured — as a link to
            // its collect view. stopPropagation keeps clicks off any parent card.
            function purlLink(purl) {
                if (!purl) return "—";
                if (!magpieURL) return esc(purl);
                const href = `${magpieURL}/app/collect?purl=${encodeURIComponent(purl)}`;
                return `<a class="pkg-link" href="${esc(href)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(purl)}</a>`;
            }

            function statusBadge(status, vulnCount, worstBucket) {
                const buckets = ["critical", "high", "medium", "low"];
                // When we know the worst severity (detail page), color the pill by
                // it even if the endpoint is stale/generic-vulnerable.
                const sev = buckets.includes(worstBucket)
                    ? worstBucket
                    : buckets.includes(status)
                      ? status
                      : null;
                if (sev)
                    return `<span class="badge badge-${sev}"><span class="dot dot-${sev}"></span>${vulnCount} vuln${vulnCount !== 1 ? "s" : ""}</span>`;
                if (status === "vulnerable")
                    return `<span class="badge badge-vulnerable"><span class="dot dot-vuln"></span>${vulnCount} vuln${vulnCount !== 1 ? "s" : ""}</span>`;
                if (status === "stale")
                    return `<span class="badge badge-stale-pill"><span class="dot dot-stale"></span>${vulnCount > 0 ? vulnCount + " vuln" + (vulnCount !== 1 ? "s" : "") : "stale"}</span>`;
                return `<span class="badge badge-clean"><span class="dot dot-clean"></span>clean</span>`;
            }

            function relativeTime(iso) {
                if (!iso) return "";
                const diff = Date.now() - new Date(iso).getTime();
                const m = Math.floor(diff / 60000);
                if (m < 1) return "just now";
                if (m < 60) return `${m}m ago`;
                const h = Math.floor(m / 60);
                if (h < 24) return `${h}h ago`;
                return `${Math.floor(h / 24)}d ago`;
            }

            // Long-form "X ago" — days/weeks/months/years for date fields.
            function fmtAgo(iso) {
                if (!iso) return "";
                const diff = Date.now() - new Date(iso).getTime();
                const sec = Math.floor(diff / 1000);
                if (sec < 60) return "just now";
                const min = Math.floor(sec / 60);
                if (min < 60) return `${min} min ago`;
                const h = Math.floor(min / 60);
                if (h < 24) return `${h}h ago`;
                const d = Math.floor(h / 24);
                if (d < 7) return `${d} day${d !== 1 ? "s" : ""} ago`;
                const w = Math.floor(d / 7);
                if (d < 30) return `${w} week${w !== 1 ? "s" : ""} ago`;
                const mo = Math.floor(d / 30);
                if (d < 365) return `${mo} month${mo !== 1 ? "s" : ""} ago`;
                const y = Math.floor(d / 365);
                return `${y} year${y !== 1 ? "s" : ""} ago`;
            }

            // DD/MM/YYYY (X ago) — the canonical date format across the app.
            function fmtDate(iso) {
                if (!iso) return "—";
                const d = new Date(iso);
                if (isNaN(d.getTime())) return "—";
                const dd = String(d.getDate()).padStart(2, "0");
                const mm = String(d.getMonth() + 1).padStart(2, "0");
                return `${dd}/${mm}/${d.getFullYear()} (${fmtAgo(iso)})`;
            }

            function fmtMillis(ms) {
                if (!ms || ms <= 0) return "—";
                if (ms < 1000) return `${ms}ms`;
                return `${(ms / 1000).toFixed(1)}s`;
            }

            // Ecosystems aren't semantic, so the projects ring uses a neutral gray
            // ramp (per DESIGN.md: no brand colors) instead of the severity palette.
            const ECO_LABELS = {
                npm: "JS",
                pypi: "Python",
                golang: "Go",
                cargo: "Rust",
                conan: "C/C++",
            };
            const ECO_RAMP = [
                "#737373",
                "#a3a3a3",
                "#c2c2c2",
                "#d4d4d4",
                "#e5e5e5",
            ];

            function renderTags(tags) {
                if (!tags || !tags.length) return "";
                return tags
                    .map((t) => `<span class="tag">${esc(t)}</span>`)
                    .join("");
            }

            // ── data loading ──────────────────────────────────────────────────────────

            // Reads the current session's role and toggles guest UI. Write actions
            // are also blocked server-side (403); this only hides what would fail.
            async function loadSession() {
                try {
                    const res = await apiFetch("/v1/session");
                    if (!res || !res.ok) return;
                    const data = await res.json();
                    isGuest = data.role === "guest";
                    magpieURL = data.magpie_url || "";
                } catch (e) {
                    isGuest = false;
                }
                applyGuestChrome();
            }

            function applyGuestChrome() {
                const badge = document.getElementById("guest-badge");
                if (badge) badge.style.display = isGuest ? "" : "none";
                const settings = document.getElementById("nav-settings");
                if (settings) settings.style.display = isGuest ? "none" : "";
                const saveBtn = document.getElementById("btn-save-settings");
                if (saveBtn) saveBtn.style.display = isGuest ? "none" : "";
            }

            async function loadEndpoints() {
                try {
                    const res = await apiFetch("/v1/endpoints");
                    if (!res) return; // 401 → apiFetch already redirected to login
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    allEndpoints = data.endpoints || [];
                    totalCount = data.total || 0;
                    document.getElementById("error-container").innerHTML = "";
                    render();
                } catch (e) {
                    document.getElementById("error-container").innerHTML =
                        `<div class="error-banner">Could not reach server — ${e.message}</div>`;
                }
            }

            // ── tag filter pills ──────────────────────────────────────────────────────

            function renderTagFilter() {
                const tags = [
                    ...new Set(allEndpoints.flatMap((ep) => ep.tags || [])),
                ].sort();
                const tf = document.getElementById("tag-filter");
                if (!tags.length) {
                    tf.innerHTML = "";
                    return;
                }
                tf.innerHTML = [null, ...tags]
                    .map(
                        (t) => `
      <button class="tag-filter-btn${activeTag === t ? " active" : ""}"
              data-tag="${t === null ? "" : esc(t)}" onclick="setTag(this.dataset.tag || null)">
        ${t === null ? "All" : esc(t)}
      </button>`,
                    )
                    .join("");
            }

            // ── main render ───────────────────────────────────────────────────────────

            function render() {
                renderTagFilter();

                const filtered = activeTag
                    ? allEndpoints.filter((ep) =>
                          (ep.tags || []).includes(activeTag),
                      )
                    : allEndpoints;

                document.getElementById("count-label").textContent = totalCount
                    ? `(${totalCount})`
                    : "";

                viewMode === "panel"
                    ? renderPanel(filtered)
                    : renderList(filtered);
            }

            // ── list view ─────────────────────────────────────────────────────────────

            function renderList(endpoints) {
                const el = document.getElementById("endpoint-list");
                el.className = "endpoint-list";

                if (!endpoints.length) {
                    el.innerHTML =
                        '<div class="empty">No endpoints yet. Run <code>meerkat scan</code> to get started.</div>';
                    return;
                }

                el.innerHTML = endpoints
                    .map(
                        (ep) => `
      <div class="endpoint-card${ep.id === selectedID ? " active" : ""}"
           data-id="${esc(ep.id)}" onclick="selectEndpoint(this.dataset.id)">
        <div class="endpoint-main">
          <div class="endpoint-hostname">${esc(ep.hostname)}</div>
          <div class="endpoint-meta">
            <span>${esc(ep.os)} / ${esc(ep.arch)}</span>
            <span>${relativeTime(ep.last_seen)}</span>
            ${renderTags(ep.tags)}
          </div>
        </div>
        ${statusBadge(ep.status, ep.vuln_count)}
      </div>`,
                    )
                    .join("");
            }

            // ── panel view ────────────────────────────────────────────────────────────

            function renderPanel(endpoints) {
                const el = document.getElementById("endpoint-list");
                el.className = "panel-grid";

                if (!endpoints.length) {
                    el.innerHTML =
                        '<div class="empty">No endpoints yet. Run <code>meerkat scan</code> to get started.</div>';
                    return;
                }

                el.innerHTML = endpoints
                    .map((ep) => {
                        const buckets = ["critical", "high", "medium", "low"];
                        const statusClass = buckets.includes(ep.status)
                            ? `panel-${ep.status}`
                            : ep.status === "vulnerable"
                              ? "panel-vulnerable"
                              : ep.status === "stale"
                                ? "panel-stale"
                                : "panel-clean";
                        const tip = `${esc(ep.hostname)}\n${esc(ep.os)} / ${esc(ep.arch)}`;
                        const showCount = [
                            "critical",
                            "high",
                            "medium",
                            "low",
                            "vulnerable",
                        ].includes(ep.status);
                        const count = showCount
                            ? `<span class="panel-count">${ep.vuln_count}</span>`
                            : ep.status === "stale"
                              ? `<span class="panel-count">${ep.vuln_count > 0 ? ep.vuln_count : "—"}</span>`
                              : `<span class="panel-count">OK</span>`;
                        return `
        <div class="panel-cell ${statusClass}${ep.id === selectedID ? " active" : ""}"
             data-tip="${tip}" data-id="${esc(ep.id)}"
             onclick="selectEndpoint(this.dataset.id)">
          ${count}
        </div>`;
                    })
                    .join("");
            }

            // ── detail (navigate to vuln page) ────────────────────────────────────────

            function selectEndpoint(id) {
                navigateTo(`/app/endpoint/${encodeURIComponent(id)}`);
            }

            // Sync toggle buttons to persisted state before first render
            document
                .getElementById("btn-list")
                .classList.toggle("active", viewMode === "list");
            document
                .getElementById("btn-panel")
                .classList.toggle("active", viewMode === "panel");

            // ── routing ───────────────────────────────────────────────────────────────

            function showMain() {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("btn-logout").style.display = "";
                document.getElementById("app-footer").style.display = "";
                document.querySelector(".section-header").style.display = "";
                document.getElementById("endpoint-list").style.display = "";
                document.getElementById("vuln-page").style.display = "none";
                document.getElementById("vulns-page").style.display = "none";
                document.getElementById("settings-container").style.display =
                    "none";
            }

            function showSettings() {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("btn-logout").style.display = "";
                document.getElementById("app-footer").style.display = "";
                document.querySelector(".section-header").style.display =
                    "none";
                document.getElementById("endpoint-list").style.display = "none";
                document.getElementById("vuln-page").style.display = "none";
                document.getElementById("vulns-page").style.display = "none";
                document.getElementById("settings-container").style.display =
                    "";
                loadSettings();
            }

            function showVulns() {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("btn-logout").style.display = "";
                document.getElementById("app-footer").style.display = "";
                document.querySelector(".section-header").style.display =
                    "none";
                document.getElementById("endpoint-list").style.display = "none";
                document.getElementById("detail-container").style.display =
                    "none";
                document.getElementById("vuln-page").style.display = "none";
                document.getElementById("settings-container").style.display =
                    "none";
                document.getElementById("vulns-page").style.display = "";
                loadVulns();
            }

            function goHome() {
                navigateTo("/app");
            }

            function showLogin() {
                document.getElementById("login-section").style.display = "";
                document.getElementById("app-footer").style.display = "none";
                document.querySelector(".section-header").style.display =
                    "none";
                document.getElementById("endpoint-list").style.display = "none";
                document.getElementById("detail-container").style.display =
                    "none";
                document.getElementById("vuln-page").style.display = "none";
                document.getElementById("vulns-page").style.display = "none";
                document.getElementById("settings-container").style.display =
                    "none";
                document.getElementById("login-error").textContent = "";
            }

            async function doLogin() {
                const key = document.getElementById("login-key").value.trim();
                if (!key) {
                    document.getElementById("login-error").textContent =
                        "API key is required.";
                    return;
                }
                try {
                    const res = await fetch("/app/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ key }),
                    });
                    if (res.ok) {
                        document.getElementById("login-key").value = "";
                        navigateTo("/app");
                    } else {
                        const data = await res.json().catch(() => ({}));
                        document.getElementById("login-error").textContent =
                            data.detail || "Invalid key.";
                    }
                } catch (e) {
                    document.getElementById("login-error").textContent =
                        "Request failed: " + e.message;
                }
            }

            async function doLogout() {
                await fetch("/app/logout", { method: "POST" });
                navigateTo("/app/login");
            }

            // Intercept 401 from any API call and redirect to login.
            async function apiFetch(url, opts) {
                const res = await fetch(url, opts);
                if (res.status === 401) {
                    navigateTo("/app/login");
                    return null;
                }
                return res;
            }

            function handleRoute(path) {
                const rel = path.startsWith("/app")
                    ? path.slice("/app".length) || "/"
                    : path;
                // The nav is app chrome — hide it on the login gate.
                document.querySelector("nav").style.display =
                    rel === "/login" ? "none" : "flex";
                // Refresh session role on any authenticated route (toggles guest UI).
                if (rel !== "/login") loadSession();
                // Highlight the active section: Settings, Vulnerabilities, else Endpoints.
                const activeRoute = rel.startsWith("/settings")
                    ? "/app/settings"
                    : rel.startsWith("/vulnerabilities")
                      ? "/app/vulnerabilities"
                      : "/app";
                document.querySelectorAll("nav .nav-link").forEach((a) => {
                    a.classList.toggle(
                        "active",
                        a.dataset.route === activeRoute,
                    );
                });
                if (rel === "/login") {
                    showLogin();
                } else if (rel === "/settings") {
                    showSettings();
                } else if (rel === "/vulnerabilities") {
                    showVulns();
                } else if (rel.startsWith("/endpoint/")) {
                    const id = decodeURIComponent(
                        rel.slice("/endpoint/".length),
                    );
                    loadVulnPage(id);
                } else {
                    showMain();
                    loadEndpoints();
                }
            }

            function navigateTo(path) {
                history.pushState({}, "", path);
                handleRoute(path);
            }

            window.addEventListener("popstate", () =>
                handleRoute(location.pathname),
            );

            // ── vuln page ─────────────────────────────────────────────────────────────

            let vpEndpoint = null;
            let vpId = null;
            let vpHistory = [];
            // The backend owns filtering/sorting/pagination; the FE just renders.
            let vpPageVulns = []; // current page only
            let vpBucketCounts = { critical: 0, high: 0, medium: 0, low: 0 };
            let vpTotal = 0; // full grouped count (donut)
            let vpFilteredTotal = 0; // count after bucket/search filter (pagination)
            let vpPage = 0;
            let vpSearch = "";
            let vpBucket = "";
            let vpProject = "";
            let vpSort = "exposure";
            let vpSearchTimer = null;
            const VP_PER_PAGE = 20;
            const vpOpenRows = new Set();

            async function loadVulnPage(id) {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("btn-logout").style.display = "";
                document.getElementById("app-footer").style.display = "";
                document.querySelector(".section-header").style.display =
                    "none";
                document.getElementById("endpoint-list").style.display = "none";
                document.getElementById("vulns-page").style.display = "none";
                document.getElementById("settings-container").style.display =
                    "none";
                const page = document.getElementById("vuln-page");
                page.style.display = "";
                page.innerHTML =
                    '<div class="empty" style="padding:64px 0;text-align:center">Loading…</div>';
                vpId = id;
                vpPage = 0;
                vpSearch = "";
                vpBucket = "";
                vpProject = "";
                vpSort = "exposure";
                try {
                    const [epRes, histRes] = await Promise.all([
                        apiFetch(vulnQueryURL()),
                        apiFetch(`/v1/endpoints/${id}/history?days=30`),
                    ]);
                    if (!epRes) return; // 401 → apiFetch already redirected to login
                    if (!epRes.ok) throw new Error(`HTTP ${epRes.status}`);
                    vpEndpoint = await epRes.json();
                    vpPageVulns = vpEndpoint.vulnerabilities || [];
                    vpBucketCounts = vpEndpoint.bucket_counts || vpBucketCounts;
                    vpTotal = vpEndpoint.vuln_total ?? vpPageVulns.length;
                    vpFilteredTotal = vpEndpoint.filtered_total ?? vpTotal;
                    vpHistory = histRes.ok
                        ? (await histRes.json()).days || []
                        : [];
                    vpOpenRows.clear();
                    renderVulnPage();
                } catch (e) {
                    page.innerHTML = `<div class="error-banner">Could not load endpoint — ${e.message}</div>`;
                }
            }

            function buildTimeline(history) {
                const byDate = {};
                for (const h of history) byDate[h.date] = h;
                const days = [];
                for (let i = 29; i >= 0; i--) {
                    const d = new Date();
                    d.setUTCDate(d.getUTCDate() - i);
                    days.push(d.toISOString().slice(0, 10));
                }
                const squares = days
                    .map((date) => {
                        const [y, m, dd] = date.split("-");
                        const human = `${dd}/${m}/${y}`;
                        const h = byDate[date];
                        if (!h)
                            return `<div class="tl-day tl-empty" title="${human} — no data"></div>`;
                        const tip = `${human} — ${h.status}${h.vuln_count ? ", " + h.vuln_count + " vuln" + (h.vuln_count !== 1 ? "s" : "") : ""}`;
                        return `<div class="tl-day tl-${h.status}" title="${tip}"></div>`;
                    })
                    .join("");
                return `<div class="ep-timeline">
                    <span class="ep-tl-label">30d</span>
                    ${squares}
                    <span class="ep-tl-label">today</span>
                </div>`;
            }

            function buildDonut(counts, total) {
                const r = 60,
                    sw = 22,
                    circ = 2 * Math.PI * r;
                if (total === 0)
                    return `<circle r="${r}" cx="80" cy="80" fill="none" stroke="#e5e5e5" stroke-width="${sw}"/>`;
                const colors = {
                    critical: "#ef4444",
                    high: "#f97316",
                    medium: "#eab308",
                    low: "#94a3b8",
                };
                let cum = 0;
                return ["critical", "high", "medium", "low"]
                    .map((b) => {
                        const count = counts[b] || 0;
                        if (!count) return "";
                        const arc = (count / total) * circ;
                        const seg = `<circle r="${r}" cx="80" cy="80" fill="none" stroke="${colors[b]}" stroke-width="${sw}"
                        stroke-dasharray="${arc.toFixed(2)} ${(circ - arc).toFixed(2)}"
                        stroke-dashoffset="${(circ / 4 - cum).toFixed(2)}"/>`;
                        cum += arc;
                        return seg;
                    })
                    .join("");
            }

            // Grayscale donut of scanned projects, segmented by ecosystem.
            function buildProjectsDonut(entries, total) {
                const r = 60,
                    sw = 22,
                    circ = 2 * Math.PI * r;
                if (total === 0)
                    return `<circle r="${r}" cx="80" cy="80" fill="none" stroke="#e5e5e5" stroke-width="${sw}"/>`;
                let cum = 0;
                return entries
                    .map(([eco, count], i) => {
                        if (!count) return "";
                        const arc = (count / total) * circ;
                        const seg = `<circle r="${r}" cx="80" cy="80" fill="none" stroke="${ECO_RAMP[i % ECO_RAMP.length]}" stroke-width="${sw}"
                        stroke-dasharray="${arc.toFixed(2)} ${(circ - arc).toFixed(2)}"
                        stroke-dashoffset="${(circ / 4 - cum).toFixed(2)}"/>`;
                        cum += arc;
                        return seg;
                    })
                    .join("");
            }

            function deltaChip(label, delta) {
                const sign = delta > 0 ? `+${delta}` : `${delta}`;
                const cls =
                    delta > 0
                        ? "delta-up"
                        : delta < 0
                          ? "delta-down"
                          : "delta-flat";
                return `<span class="ep-metric"><span class="ep-metric-val ${cls}">${sign}</span> <span class="ep-metric-label">${label}</span></span>`;
            }

            // Builds the endpoint URL with the current filter/sort/page state.
            function vulnQueryURL() {
                const p = new URLSearchParams();
                p.set("sort", vpSort);
                if (vpBucket) p.set("bucket", vpBucket);
                if (vpProject) p.set("project", vpProject);
                if (vpSearch.trim()) p.set("q", vpSearch.trim());
                p.set("limit", VP_PER_PAGE);
                p.set("offset", vpPage * VP_PER_PAGE);
                return `/v1/endpoints/${vpId}?${p.toString()}`;
            }

            // Debounce search so we don't fire a request per keystroke.
            function onVulnSearchInput(val) {
                vpSearch = val;
                vpPage = 0;
                clearTimeout(vpSearchTimer);
                vpSearchTimer = setTimeout(updateVulnList, 250);
            }

            function setVulnBucket(val) {
                vpBucket = val;
                vpPage = 0;
                updateVulnList();
            }

            function setVulnProject(val) {
                vpProject = val;
                vpPage = 0;
                updateVulnList();
            }

            // A project's dir shown relative to scan_root: short, but still
            // disambiguates same-named dirs in different locations (the value
            // sent to the backend stays the absolute dir for an exact match).
            function projectLabel(dir, root) {
                if (dir === root) return ".";
                if (root && dir.startsWith(root + "/"))
                    return dir.slice(root.length + 1);
                return dir;
            }

            // Builds the <select> for the project filter from project_stats — the
            // projects that actually have vulns, derived live from the vuln data.
            // WHY: deriving from the vulns (not persisted scan metadata) keeps the
            // filter immune to client-version skew, and a clean project would
            // filter to zero results anyway. Empty string when there are none.
            function projectSelect() {
                const stats = (vpEndpoint && vpEndpoint.project_stats) || [];
                if (!stats.length) return "";
                const root = (vpEndpoint && vpEndpoint.scan_root) || "";
                const opts = stats
                    .map((s) => ({ dir: s.dir, label: projectLabel(s.dir, root) }))
                    .sort((a, b) => a.label.localeCompare(b.label))
                    .map(
                        (p) =>
                            `<option value="${esc(p.dir)}"${vpProject === p.dir ? " selected" : ""}>${esc(p.label)}</option>`,
                    )
                    .join("");
                return `<select class="vuln-bucket-select" onchange="setVulnProject(this.value)">
                    <option value="">All projects</option>
                    ${opts}
                </select>`;
            }

            function setVulnSort(val) {
                vpSort = val;
                vpPage = 0;
                updateVulnList();
            }

            // Builds the report URL; project ("" = all) only applies to the fix kind.
            function reportURL(kind, project) {
                const p = new URLSearchParams({ kind });
                if (project) p.set("project", project);
                return `/v1/endpoints/${vpId}/report?${p.toString()}`;
            }

            // Report downloads. audit → JSON file; fix → Markdown copied to clipboard.
            async function downloadReport(kind, project) {
                if (!vpId) return;
                const res = await apiFetch(reportURL(kind, project));
                if (!res || !res.ok) return;
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `meerkat-${kind}.${kind === "fix" ? "md" : "json"}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            }

            async function copyReport(kind, project, labelSelector) {
                if (!vpId) return;
                const res = await apiFetch(reportURL(kind, project));
                if (!res || !res.ok) return;
                const text = await res.text();
                try {
                    await navigator.clipboard.writeText(text);
                    const label = labelSelector
                        ? document.querySelector(labelSelector)
                        : null;
                    if (label) {
                        const prev = label.textContent;
                        label.textContent = "Copied";
                        setTimeout(() => {
                            label.textContent = prev;
                        }, 1500);
                    }
                } catch (e) {
                    downloadReport(kind, project); // clipboard blocked → fall back to a download
                }
            }

            // Mechanic modal: pick a project (or all) and copy a fix-prompt scoped
            // to it. Only projects that actually have vulns are offered.
            function openMechanic() {
                const stats = (vpEndpoint && vpEndpoint.project_stats) || [];
                const root = (vpEndpoint && vpEndpoint.scan_root) || "";
                const options = stats
                    .filter((s) => s.vuln_count > 0)
                    .map(
                        (s) =>
                            `<option value="${esc(s.dir)}">${esc(projectLabel(s.dir, root))}</option>`,
                    )
                    .join("");
                const overlay = document.createElement("div");
                overlay.className = "modal-overlay";
                overlay.innerHTML = `
                    <div class="modal-card" role="dialog" aria-label="Mechanic">
                        <div class="modal-head">
                            <span class="modal-title">Mechanic</span>
                            <button class="modal-close" onclick="closeMechanic()" aria-label="Close">×</button>
                        </div>
                        <p class="modal-sub">Generate a remediation prompt for a coding agent, scoped to one project.</p>
                        <select class="vuln-bucket-select" id="mechanic-project" onchange="updateMechanicStats()">
                            <option value="">All projects</option>
                            ${options}
                        </select>
                        <div class="mechanic-stats" id="mechanic-stats"></div>
                        <button class="btn" id="mechanic-copy" onclick="copyMechanic()">
                            <span class="btn-label">Copy fix prompt</span>
                        </button>
                        <ol class="mechanic-help">
                            <li>Paste the copied prompt into a coding agent (Claude Code, etc.).</li>
                            <li>It bumps the listed packages and updates the lockfile, one project at a time.</li>
                            <li>Verify the project still builds before moving on.</li>
                        </ol>
                    </div>`;
                overlay.addEventListener("click", (e) => {
                    if (e.target === overlay) closeMechanic();
                });
                document.body.appendChild(overlay);
                document.addEventListener("keydown", mechanicEsc);
                updateMechanicStats();
            }

            function mechanicEsc(e) {
                if (e.key === "Escape") closeMechanic();
            }

            function closeMechanic() {
                document.removeEventListener("keydown", mechanicEsc);
                const overlay = document.querySelector(".modal-overlay");
                if (overlay) overlay.remove();
            }

            // Reflects the selected project's counts; "All projects" uses the
            // endpoint-wide totals (deduplicated, not a sum of per-project counts).
            function updateMechanicStats() {
                const sel = document.getElementById("mechanic-project");
                const el = document.getElementById("mechanic-stats");
                if (!sel || !el) return;
                let vulns, fixable;
                if (sel.value === "") {

                document.getElementById("vuln-page").innerHTML = `
<div class="ep-page">
    <div class="ep-page-top">
