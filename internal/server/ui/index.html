                                : "");
                        return r.url
                            ? `<a class="vuln-ref-chip" href="${r.url}" target="_blank" rel="noopener">${lbl}</a>`
                            : `<span class="vuln-ref-chip">${lbl}</span>`;
                    })
                    .join("");
                const isOpen = vpOpenRows.has(v.canonical_id);
                const safeId = v.canonical_id.replace(/[^a-zA-Z0-9]/g, "-");
                const escapedCid = v.canonical_id
                    .replace(/&/g, "&amp;")
                    .replace(/"/g, "&quot;");

                // Right-side chips: exposure (bucketBadge), CVSS, then NEW.
                const sev =
                    v.severity_score > 0 ? v.severity_score.toFixed(1) : null;
                const cvssChip = sev
                    ? `<span class="vuln-tag">CVSS ${sev}</span>`
                    : "";
                const newPill = v.is_new
                    ? `<span class="vuln-new">NEW</span>`
                    : "";
                const dateParts = [];
                if (v.published_at)
                    dateParts.push(
                        `<span><span class="vm-k">Created</span> ${fmtDate(v.published_at)}</span>`,
                    );
                if (v.modified_at)
                    dateParts.push(
                        `<span><span class="vm-k">Updated</span> ${fmtDate(v.modified_at)}</span>`,
                    );
                if (v.discovered_at)
                    dateParts.push(
                        `<span><span class="vm-k">Discovered</span> ${fmtDate(v.discovered_at)}</span>`,
                    );
                const detailMain = `<div class="vuln-detail-main">
                        ${chips ? `<div class="vuln-aliases">${chips}</div>` : ""}
                        ${v.summary ? `<div class="vuln-row-summary">${v.summary}</div>` : ""}
                    </div>`;
                const datesCol = dateParts.length
                    ? `<div class="vuln-dates">${dateParts.join("")}</div>`
                    : "";
                const detailTop = `<div class="vuln-detail-top">${detailMain}${datesCol}</div>`;

                const pkgRows = (v.affected_packages || [])
                    .flatMap((p) =>
                        (p.dirs?.length ? p.dirs : ["—"]).map(
                            (d) =>
                                `<tr><td class="pkg-purl-cell">${p.purl}</td><td>${d}</td><td>${p.kind || "—"}</td><td>${p.scope || "—"}</td><td>${p.discovered_at ? fmtDate(p.discovered_at) : "—"}</td></tr>`,
                        ),
                    )
                    .join("");
                return `<div class="vuln-row-new${isOpen ? " open" : ""}" id="vrow-${safeId}" data-cid="${escapedCid}">
                    <div class="vuln-row-header" onclick="toggleVuln(this.closest('[data-cid]').dataset.cid)">
                        <div class="vuln-row-header-left">
                            <span class="vuln-cid">${v.canonical_id}</span>
                        </div>
                        <div class="vuln-row-header-right">
                            ${bucketBadge}
                            ${cvssChip}
                            ${newPill}
                            ${pkgCount ? `<span class="vuln-pkg-count">← ${pkgCount} pkg${pkgCount !== 1 ? "s" : ""}</span>` : ""}
                            <span class="vuln-chevron${isOpen ? " open" : ""}">▶</span>
                        </div>
                    </div>
                    ${detailTop}
                    <div class="vuln-pkg-area">
                        ${
                            pkgRows
                                ? `<table class="pkg-table">
                            <thead><tr><th>Package</th><th>Dir</th><th>Kind</th><th>Scope</th><th>Discovered</th></tr></thead>
                            <tbody>${pkgRows}</tbody>
                        </table>`
                                : ""
                        }
                    </div>
                </div>`;
            }

            function toggleVuln(canonicalId) {
                const safeId = canonicalId.replace(/[^a-zA-Z0-9]/g, "-");
                if (vpOpenRows.has(canonicalId)) vpOpenRows.delete(canonicalId);
                else vpOpenRows.add(canonicalId);
                const open = vpOpenRows.has(canonicalId);
                const row = document.getElementById(`vrow-${safeId}`);
                if (row) {
                    row.classList.toggle("open", open);
                    const ch = row.querySelector(".vuln-chevron");
                    if (ch) ch.classList.toggle("open", open);
                }
            }

            // ── settings ──────────────────────────────────────────────────────────────

            async function loadSettings() {
                try {
                    const res = await apiFetch("/v1/settings");
                    if (!res || !res.ok)
                        throw new Error(
                            res ? `HTTP ${res.status}` : "redirected",
                        );
                    const data = await res.json();
                    const email = data.notifications?.email || {};
                    document.getElementById("email-enabled").checked =
                        email.enabled ?? true;
                    document.getElementById("email-recipients").value = (
                        email.recipients || []
                    ).join("\n");
                } catch (e) {
                    setFeedback("Could not load settings: " + e.message, false);
                }
            }

            async function saveSettings() {
                const enabled =
                    document.getElementById("email-enabled").checked;
                const raw = document.getElementById("email-recipients").value;
                const recipients = raw
                    .split("\n")
                    .map((s) => s.trim())
                    .filter(Boolean);
                try {
                    const res = await apiFetch("/v1/settings", {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            notifications: { email: { enabled, recipients } },
                        }),
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        setFeedback(
                            data.detail || `Error ${res.status}`,
                            false,
                        );
                        return;
                    }
                    setFeedback("Saved", true);
                } catch (e) {
                    setFeedback("Could not save: " + e.message, false);
                }
            }

            function setFeedback(msg, ok) {
                const el = document.getElementById("settings-feedback");
                el.textContent = msg;
                el.className = "settings-feedback " + (ok ? "ok" : "err");
            }

            // ── init ──────────────────────────────────────────────────────────────────

            // External links — rendered once into the login card and the nav.
            const BRAND_LINKS = [
                {
                    href: "https://github.com/ezequielcamezzana/meerkat",
                    title: "GitHub",
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 .1.8 1.6 2.6 1.4.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.6 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1.9-.2 1.8-.4 2.7-.4.9 0 1.8.1 2.7.4 2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.3-5.1 5.6.4.3.8 1 .8 2.1v3.1c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>`,
                },
                {
                    href: "https://github.com/ezequielcamezzana/meerkat/tree/main/docs",
                    title: "Docs",
                    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h7a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"/></svg>`,
                },
                {
                    href: "https://github.com/ezequielcamezzana/meerkat/releases",
                    title: "Install",
                    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
                },
            ];
            const brandLinksHTML = BRAND_LINKS.map(
                (l) =>
                    `<a class="icon-link" href="${l.href}" target="_blank" rel="noopener" title="${l.title}" aria-label="${l.title}">${l.svg}</a>`,
            ).join("");
            document.getElementById("login-links").innerHTML = brandLinksHTML;
            document.getElementById("nav-icons").innerHTML = brandLinksHTML;

            handleRoute(location.pathname);
            setInterval(() => {
                const p = location.pathname;
                if (p === "/app/login") return; // don't poll the API while logged out
                if (!p.startsWith("/app/endpoint/") && p !== "/app/settings")
                    loadEndpoints();
            }, 30000);
        </script>
    </body>
