            function buildPagi(filteredLen, totalPages) {
                return `<span>${filteredLen} result${filteredLen !== 1 ? "s" : ""}</span>
                    <button class="page-btn" onclick="vpPage--;updateVulnList()" ${vpPage === 0 ? "disabled" : ""}>‹</button>
                    <span>${vpPage + 1} / ${totalPages}</span>
                    <button class="page-btn" onclick="vpPage++;updateVulnList()" ${vpPage >= totalPages - 1 ? "disabled" : ""}>›</button>`;
            }

            // Re-fetch the current page from the backend and refresh list + pager.
            // The donut/legend (bucket_counts, vuln_total) stay as loaded.
            async function updateVulnList() {
                if (!vpId) return;
                const res = await apiFetch(vulnQueryURL());
                if (!res || !res.ok) return;
                const d = await res.json();
                vpPageVulns = d.vulnerabilities || [];
                vpFilteredTotal = d.filtered_total ?? vpPageVulns.length;
                const totalPages = Math.max(
                    1,
                    Math.ceil(vpFilteredTotal / VP_PER_PAGE),
                );
                const pagi = document.getElementById("vp-pagi");
                if (pagi)
                    pagi.innerHTML = buildPagi(vpFilteredTotal, totalPages);
                renderVulnList();
            }

            function renderVulnList() {
                const container = document.getElementById(
                    "vuln-list-container",
                );
                if (!container) return;
                if (!vpPageVulns.length) {
                    container.className = "";
                    container.innerHTML =
                        '<div class="empty" style="padding:32px 0">No vulnerabilities match the filter.</div>';
                    return;
                }
                container.className = "vuln-list-new";
                container.innerHTML = vpPageVulns.map(renderVulnRow).join("");
            }

            function renderVulnRow(v) {
                const bucket = v.exposure_bucket || "clean";
                const score =
                    v.exposure_score > 0 ? v.exposure_score.toFixed(1) : null;
                const pkgCount = (v.affected_packages || []).length;
                const bucketBadge =
                    bucket !== "clean"
                        ? `<span class="bucket-badge bucket-${bucket}">ExS · ${score} · ${bucket}<span class="es-info-wrap"><span class="es-info-icon">ⓘ</span
                        ><span class="es-tooltip">Exposure Score — severity × scope weight × kind weight</span
                        ></span></span>`
                        : "";
                const chips = (v.vulns || [])
                    .map((r) => {
                        const lbl =
                            r.id +
                            (v.severity_score > 0
                                ? ` (${v.severity_score.toFixed(1)})`
                                : "");
                        return r.url
                            ? `<a class="vuln-ref-chip" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(lbl)}</a>`
                            : `<span class="vuln-ref-chip">${esc(lbl)}</span>`;
                    })
                    .join("");
                const isOpen = vpOpenRows.has(v.canonical_id);
                const safeId = v.canonical_id.replace(/[^a-zA-Z0-9]/g, "-");
                const escapedCid = v.canonical_id
                    .replace(/&/g, "&amp;")
                    .replace(/"/g, "&quot;");

                // Right-side chips: exposure (bucketBadge), CVSS, then NEW.
                const sev =
                    v.severity_score > 0 ? v.severity_score.toFixed(1) : null;
                const cvssChip = sev
                    ? `<span class="bucket-badge bucket-${v.cvss_bucket}">CVSS · ${sev} · ${v.cvss_bucket}</span>`
                    : "";
                const newPill = v.is_new
                    ? `<span class="vuln-new">NEW</span>`
                    : "";
                const dateParts = [];
                if (v.published_at)
                    dateParts.push(
                        `<span><span class="vm-k">Created</span> ${fmtDate(v.published_at)}</span>`,
                    );
                if (v.modified_at)
                    dateParts.push(
                        `<span><span class="vm-k">Updated</span> ${fmtDate(v.modified_at)}</span>`,
                    );
                if (v.discovered_at)
                    dateParts.push(
                        `<span><span class="vm-k">Discovered</span> ${fmtDate(v.discovered_at)}</span>`,
                    );
                const detailMain = `<div class="vuln-detail-main">
                        ${chips ? `<div class="vuln-aliases">${chips}</div>` : ""}
                        ${v.summary ? `<div class="vuln-row-summary">${esc(v.summary)}</div>` : ""}
                    </div>`;
                const datesCol = dateParts.length
                    ? `<div class="vuln-dates">${dateParts.join("")}</div>`
                    : "";
                const detailTop = `<div class="vuln-detail-top">${detailMain}${datesCol}</div>`;

                const pkgRows = (v.affected_packages || [])
                    .flatMap((p) =>
                        (p.dirs?.length ? p.dirs : ["—"]).map(
                            (d) =>
                                `<tr><td class="pkg-purl-cell">${purlLink(p.purl)}</td><td>${esc(d)}</td><td>${esc(p.kind) || "—"}</td><td>${esc(p.scope) || "—"}</td><td>${p.discovered_at ? fmtDate(p.discovered_at) : "—"}</td></tr>`,
                        ),
                    )
                    .join("");
                return `<div class="vuln-row-new${isOpen ? " open" : ""}" id="vrow-${safeId}" data-cid="${escapedCid}">
                    <div class="vuln-row-header" onclick="toggleVuln(this.closest('[data-cid]').dataset.cid)">
                        <div class="vuln-row-header-left">
                            <span class="vuln-cid">${esc(v.canonical_id)}</span>
                        </div>
                        <div class="vuln-row-header-right">
                            ${bucketBadge}
                            ${cvssChip}
                            ${newPill}
                            ${pkgCount ? `<span class="vuln-pkg-count">${pkgCount} pkg${pkgCount !== 1 ? "s" : ""}</span>` : ""}
                            <span class="vuln-chevron${isOpen ? " open" : ""}">▶</span>
                        </div>
                    </div>
                    ${detailTop}
                    <div class="vuln-pkg-area">
                        ${
                            pkgRows
                                ? `<table class="pkg-table">
                            <thead><tr><th>Package</th><th>Dir</th><th>Kind</th><th>Scope</th><th>Discovered</th></tr></thead>
                            <tbody>${pkgRows}</tbody>
                        </table>`
                                : ""
                        }
                    </div>
                </div>`;
            }

            function toggleVuln(canonicalId) {
                const safeId = canonicalId.replace(/[^a-zA-Z0-9]/g, "-");
                if (vpOpenRows.has(canonicalId)) vpOpenRows.delete(canonicalId);
                else vpOpenRows.add(canonicalId);
                const open = vpOpenRows.has(canonicalId);
                const row = document.getElementById(`vrow-${safeId}`);
                if (row) {
                    row.classList.toggle("open", open);
                    const ch = row.querySelector(".vuln-chevron");
                    if (ch) ch.classList.toggle("open", open);
                }
            }

            // ── vulnerabilities page (vuln-centric, tenant-wide) ────────────────────────

            // Backend owns search/sort/pagination; the FE just renders.
            let gvVulns = [];
            let gvTotal = 0;
            let gvPage = 0;
            let gvSearch = "";
            let gvSort = "discovered";
            let gvSearchTimer = null;
            const GV_PER_PAGE = 20;
            const gvOpenRows = new Set();
            const gvDetailCache = {}; // canonical_id → detail, fetched once on open

            function gvSafeId(cid) {
                return cid.replace(/[^a-zA-Z0-9]/g, "-");
            }

            function gvQueryURL() {
                const p = new URLSearchParams();
                p.set("sort", gvSort);
                if (gvSearch.trim()) p.set("search", gvSearch.trim());
                p.set("limit", GV_PER_PAGE);
                p.set("offset", gvPage * GV_PER_PAGE);
                return `/v1/vulnerabilities?${p.toString()}`;
            }

            async function loadVulns() {
                const page = document.getElementById("vulns-page");
                page.innerHTML =
                    '<div class="empty" style="padding:64px 0;text-align:center">Loading…</div>';
                gvPage = 0;
                gvSearch = "";
                gvSort = "discovered";
                gvOpenRows.clear();
                try {
                    const res = await apiFetch(gvQueryURL());
                    if (!res) return; // 401 → apiFetch already redirected to login
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const d = await res.json();
                    gvVulns = d.vulnerabilities || [];
                    gvTotal = d.total ?? gvVulns.length;
                    renderVulnsPage();
                } catch (e) {
                    page.innerHTML = `<div class="error-banner">Could not load vulnerabilities — ${e.message}</div>`;
                }
            }

            function renderVulnsPage() {
                const totalPages = Math.max(
                    1,
                    Math.ceil(gvTotal / GV_PER_PAGE),
                );
                document.getElementById("vulns-page").innerHTML = `
<div class="ep-page">
    <div class="section-header">
        <h1>Vulnerabilities <span class="count-label">${gvTotal}</span></h1>
    </div>
    <div class="vuln-filter-bar">
        <div class="vuln-filter-left">
            <input class="vuln-search-input" type="text" placeholder="Search by CVE, GHSA or alias…"
                   value="${gvSearch.replace(/"/g, "&quot;")}"
                   oninput="onGVulnSearchInput(this.value)"/>
            <select class="vuln-bucket-select" onchange="setGVulnSort(this.value)">
                <option value="discovered"${gvSort === "discovered" ? " selected" : ""}>Sort: Discovered</option>
                <option value="exposure"${gvSort === "exposure" ? " selected" : ""}>Sort: Exposure</option>
            </select>
        </div>
        <div class="vuln-pagination" id="gv-pagi">${gvBuildPagi(totalPages)}</div>
    </div>
    <div id="gvuln-list-container"></div>
</div>`;
                renderGVulnList();
            }

            function gvBuildPagi(totalPages) {
                return `<span>${gvTotal} result${gvTotal !== 1 ? "s" : ""}</span>
                    <button class="page-btn" onclick="gvPage--;updateGVulnList()" ${gvPage === 0 ? "disabled" : ""}>‹</button>
                    <span>${gvPage + 1} / ${totalPages}</span>
                    <button class="page-btn" onclick="gvPage++;updateGVulnList()" ${gvPage >= totalPages - 1 ? "disabled" : ""}>›</button>`;
            }

            // Re-fetch the current page and refresh list + pager, leaving the
            // search input untouched so focus survives a debounced keystroke.
            async function updateGVulnList() {
                const res = await apiFetch(gvQueryURL());
                if (!res || !res.ok) return;
                const d = await res.json();
                gvVulns = d.vulnerabilities || [];
                gvTotal = d.total ?? gvVulns.length;
                gvOpenRows.clear();
                const totalPages = Math.max(
                    1,
                    Math.ceil(gvTotal / GV_PER_PAGE),
                );
                const pagi = document.getElementById("gv-pagi");
                if (pagi) pagi.innerHTML = gvBuildPagi(totalPages);
                renderGVulnList();
            }

            function onGVulnSearchInput(val) {
                gvSearch = val;
                gvPage = 0;
                clearTimeout(gvSearchTimer);
                gvSearchTimer = setTimeout(updateGVulnList, 250);
            }

            function setGVulnSort(val) {
                gvSort = val;
                gvPage = 0;
                updateGVulnList();
            }

            function renderGVulnList() {
                const c = document.getElementById("gvuln-list-container");
                if (!c) return;
                if (!gvVulns.length) {
                    c.className = "";
                    c.innerHTML =
                        '<div class="empty" style="padding:32px 0">No vulnerabilities found.</div>';
                    return;
                }
                c.className = "vuln-list-new";
                c.innerHTML = gvVulns.map(renderGVulnRow).join("");
            }

            // Collapsed card. The advisory body + affected endpoints load lazily
            // on expand (task 042); here we only render the summary row.
            function renderGVulnRow(v) {
                const bucket = v.exposure_bucket || "low";
                const score =
                    v.exposure_score > 0 ? v.exposure_score.toFixed(1) : null;
                const exposureBadge = score
                    ? `<span class="bucket-badge bucket-${bucket}">ExS · ${score} · ${bucket}</span>`
                    : "";
                const sev =
                    v.severity_score > 0 ? v.severity_score.toFixed(1) : null;
                const cvssChip = sev
                    ? `<span class="vuln-pkg-count">CVSS ${sev}</span>`
                    : "";
                const aliases = (v.aliases || [])
                    .map(
                        (a) => `<span class="vuln-alias-chip">${esc(a)}</span>`,
                    )
                    .join("");
                const count = v.affected_count || 0;
                const dates = [];
                if (v.discovered_at)
                    dates.push(
                        `<span><span class="vm-k">Discovered</span> ${fmtDate(v.discovered_at)}</span>`,
                    );
                if (v.modified_at)
                    dates.push(
                        `<span><span class="vm-k">Updated</span> ${fmtDate(v.modified_at)}</span>`,
                    );
                const isOpen = gvOpenRows.has(v.canonical_id);
                const safeId = gvSafeId(v.canonical_id);
                const escapedCid = v.canonical_id
                    .replace(/&/g, "&amp;")
                    .replace(/"/g, "&quot;");
                return `<div class="vuln-row-new${isOpen ? " open" : ""}" id="gvrow-${safeId}" data-cid="${escapedCid}">
                    <div class="vuln-row-header" onclick="toggleGVuln(this.closest('[data-cid]').dataset.cid)">
                        <div class="vuln-row-header-left">
                            <span class="vuln-cid">${esc(v.canonical_id)}</span>
                            ${aliases}
                        </div>
                        <div class="vuln-row-header-right">
                            ${dates.length ? `<span class="gv-row-dates">${dates.join("")}</span>` : ""}
                            ${exposureBadge}
                            ${cvssChip}
                            <span class="vuln-pkg-count">${count} endpoint${count !== 1 ? "s" : ""}</span>
                            <span class="vuln-chevron${isOpen ? " open" : ""}">▶</span>
                        </div>
                    </div>
                    <div class="gv-detail" id="gvbody-${safeId}"></div>
                </div>`;
            }

            // Toggle a card; fetch its advisory + affected endpoints on first open.
            async function toggleGVuln(cid) {
                const safeId = gvSafeId(cid);
                const row = document.getElementById(`gvrow-${safeId}`);
                if (!row) return;
                const open = !gvOpenRows.has(cid);
                if (open) gvOpenRows.add(cid);
                else gvOpenRows.delete(cid);
                row.classList.toggle("open", open);
                const ch = row.querySelector(".vuln-chevron");
                if (ch) ch.classList.toggle("open", open);
                if (open) await loadGVulnDetail(cid);
            }

            async function loadGVulnDetail(cid) {
                const body = document.getElementById(`gvbody-${gvSafeId(cid)}`);
                if (!body) return;
                if (gvDetailCache[cid]) {
                    body.innerHTML = renderGVulnDetail(gvDetailCache[cid]);
                    return;
                }
                body.innerHTML =
                    '<div class="empty" style="padding:8px 0">Loading…</div>';
                const res = await apiFetch(
                    `/v1/vulnerabilities/${encodeURIComponent(cid)}`,
                );
                if (!res || !res.ok) {
                    body.innerHTML = `<div class="error-banner">Could not load details${res ? " — HTTP " + res.status : ""}</div>`;
                    return;
                }
                const d = await res.json();
                gvDetailCache[cid] = d;
                body.innerHTML = renderGVulnDetail(d);
            }

            function renderGVulnDetail(d) {
                const text = d.details || d.summary || "";
                const advisory = text
                    ? `<div class="gv-advisory">${esc(text)}</div>`
                    : "";
                const eps = (d.affected_endpoints || [])
                    .map(renderAffectedEndpoint)
                    .join("");
                const list = eps
                    ? `<div class="gv-affected-list">${eps}</div>`
                    : '<div class="empty" style="padding:8px 0">No affected endpoints.</div>';
                return `${advisory}
                    <div>
                        <div class="gv-affected-label">Affected endpoints</div>
                        ${list}
                    </div>`;
            }

            function renderAffectedEndpoint(e) {
                const exp =
                    e.exposure_score > 0
                        ? `<span class="vuln-pkg-count">ExS · ${e.exposure_score.toFixed(1)}</span>`
                        : "";
                // Full PURL disambiguates same-name packages from different
                // ecosystems/versions on one endpoint; falls back to name@version.
                const pkg = e.purl
                    ? purlLink(e.purl)
                    : `${esc(e.package_name)}@${esc(e.package_version)}`;
                const fixed = e.fixed_version
                    ? ` · fix ${esc(e.fixed_version)}`
                    : "";
                const eid = (e.endpoint_id || "")
                    .replace(/&/g, "&amp;")
                    .replace(/"/g, "&quot;");
                return `<div class="endpoint-card" data-eid="${eid}" onclick="selectEndpoint(this.dataset.eid)">
                    <div class="endpoint-main">
                        <div class="endpoint-hostname">${esc(e.hostname)}</div>
                        <div class="endpoint-meta"><span>${esc(e.os)}</span><span>${pkg}${fixed}</span></div>
                    </div>
                    ${exp}
                </div>`;
            }

            // ── settings ──────────────────────────────────────────────────────────────

            async function loadSettings() {
                try {
                    const res = await apiFetch("/v1/settings");
                    if (!res) return; // 401 → apiFetch already redirected to login
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    const email = data.notifications?.email || {};
                    document.getElementById("email-enabled").checked =
                        email.enabled ?? true;
                    document.getElementById("email-recipients").value = (
                        email.recipients || []
                    ).join("\n");
                } catch (e) {
                    setFeedback("Could not load settings: " + e.message, false);
                }
            }

            async function saveSettings() {
                if (isGuest) return; // read-only; server would 403 anyway
                const enabled =
                    document.getElementById("email-enabled").checked;
                const raw = document.getElementById("email-recipients").value;
                const recipients = raw
                    .split("\n")
                    .map((s) => s.trim())
                    .filter(Boolean);
                try {
                    const res = await apiFetch("/v1/settings", {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            notifications: { email: { enabled, recipients } },
                        }),
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        setFeedback(
                            data.detail || `Error ${res.status}`,
                            false,
                        );
                        return;
                    }
                    setFeedback("Saved", true);
                } catch (e) {
                    setFeedback("Could not save: " + e.message, false);
                }
            }

            function setFeedback(msg, ok) {
                const el = document.getElementById("settings-feedback");
                el.textContent = msg;
                el.className = "settings-feedback " + (ok ? "ok" : "err");
            }

            // ── init ──────────────────────────────────────────────────────────────────

            // One-liner installer. A web button can't run a shell command (browser
            // sandbox), so the Install icon opens a popover that copies this instead.
            const INSTALL_CMD =
                "curl -fsSL https://raw.githubusercontent.com/ezequielcamezzana/meerkat/main/install.sh | sh";

            function toggleInstall(e) {
                e.preventDefault();
                e.stopPropagation();
                const pop =
                    e.currentTarget.parentElement.querySelector(".install-pop");
                const willOpen = pop.hidden;
                document
                    .querySelectorAll(".install-pop")
                    .forEach((p) => (p.hidden = true));
                pop.hidden = !willOpen;
            }

            function copyInstall(btn) {
                const cmd = btn
                    .closest(".install-pop")
                    .querySelector(".install-cmd").textContent;
                navigator.clipboard
                    .writeText(cmd)
                    .then(() => {
                        const prev = btn.textContent;
                        btn.textContent = "Copied";
                        setTimeout(() => {
                            btn.textContent = prev;
                        }, 1500);
                    })
                    .catch(() => {}); // clipboard blocked → user can select the visible command
            }

            // Click outside closes any open install popover.
            document.addEventListener("click", (e) => {
                if (!e.target.closest(".install-wrap")) {
                    document
                        .querySelectorAll(".install-pop")
                        .forEach((p) => (p.hidden = true));
                }
            });

            // External links — rendered once into the login card and the nav.
            const BRAND_LINKS = [
                {
                    href: "https://github.com/ezequielcamezzana/meerkat",
                    title: "GitHub",
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 .1.8 1.6 2.6 1.4.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.6 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1.9-.2 1.8-.4 2.7-.4.9 0 1.8.1 2.7.4 2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.3-5.1 5.6.4.3.8 1 .8 2.1v3.1c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>`,
                },
                {
                    href: "https://github.com/ezequielcamezzana/meerkat/tree/main/docs",
                    title: "Docs",
                    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h7a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"/></svg>`,
                },
                {
                    install: true,
                    title: "Install",
                    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
                },
            ];
            const brandLinksHTML = BRAND_LINKS.map((l) => {
                if (l.install) {
                    return `<span class="install-wrap">
                        <button class="icon-link install-trigger" type="button" title="Install" aria-label="Install" onclick="toggleInstall(event)">${l.svg}</button>
                        <div class="install-pop" hidden>
                            <div class="install-pop-label">Install — macOS / Linux</div>
                            <code class="install-cmd">${esc(INSTALL_CMD)}</code>
                            <div class="install-pop-actions">
                                <button class="btn" type="button" onclick="copyInstall(this)">Copy</button>
                                <a class="install-pop-link" href="https://github.com/ezequielcamezzana/meerkat/releases" target="_blank" rel="noopener">or download binaries →</a>
                            </div>
                        </div>
                    </span>`;
                }
                return `<a class="icon-link" href="${l.href}" target="_blank" rel="noopener" title="${l.title}" aria-label="${l.title}">${l.svg}</a>`;
            }).join("");
            document.getElementById("login-links").innerHTML = brandLinksHTML;
            document.getElementById("footer-links").innerHTML = brandLinksHTML;

            const MEERKAT_VERSION = "dev";
            document.getElementById("footer-meta").textContent =
                `meerkat · ${MEERKAT_VERSION} · ${new Date().getFullYear()}`;

            handleRoute(location.pathname);
            setInterval(() => {
                const p = location.pathname;
                if (p === "/app/login") return; // don't poll the API while logged out
                if (!p.startsWith("/app/endpoint/") && p !== "/app/settings")
                    loadEndpoints();
            }, 30000);
        </script>
    </body>
</html>
